<%+header%>
<script src="/luci-static/resources/jquery-3.7.1.min.js"></script>
<script src="/luci-static/resources/common.js"></script>

<style>
.app-form-card input[type="text"],
.app-form-card select {
    width: 200px !important;
}
.app-form-card .form-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
}
.app-form-card .form-desc {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 12px;
}
.app-form-card .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
}
.app-form-card .form-label {
    width: 140px;
    font-weight: 500;
    color: inherit;
}
button#setting-save {
    width: 80px !important;
    height: 30px !important;
    background-color: #5c9bd5 !important;
    color: white !important;
    border: none !important;
    border-radius: 5px !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer;
    line-height: 30px !important;
    text-align: center;
    padding: 0 12px !important;
    box-sizing: border-box;
}
button#setting-save:hover {
    background-color: #4a8ac2 !important;
}
button#setting-refresh {
    width: 80px !important;
    height: 30px !important;
    background: transparent !important;
    border: 1px solid #5c9bd5 !important;
    color: #5c9bd5 !important;
    border-radius: 5px !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer;
    line-height: 28px !important;
    text-align: center;
    padding: 0 12px !important;
    box-sizing: border-box;
}
button#setting-refresh:hover {
    background: #e6f0ff !important;
    border-color: #4a8ac2 !important;
    color: #4a8ac2 !important;
}
body {
    font-family: "Source Han Sans CN", "思源黑体", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
</style>

<div class="app-form-card" style="max-width:1000px; margin:0 auto; padding:5px;">
    <div class="form-title"><%:Meter Setting%></div>
    <div class="form-desc"><%:Configure traffic statistics%></div>
    <div class="form-row">
        <label class="form-label"><%:Traffic Statistics Interface%></label>
        <select id="monitor-device"></select>
    </div>
    <div class="button-container" style="margin-top:20px; margin-bottom:50px; display: flex; justify-content: flex-end; gap: 8px;">
        <button id="setting-refresh"><%:Refresh%></button>
        <button id="setting-save"><%:Save%></button>
    </div>
    <div class="status-tip" id="setting-tip"></div>
</div>

<script>
(function(){
    var _SavedSuccessfully = '<%:Saved successfully%>';
    var _SaveFailed = '<%:Save failed%>';
    var _Loading = '<%:Loading...%>';
    var _LoadFailed = '<%:Load failed%>';

    const apiGetDeviceList = '<%=url("admin/app/get_device_list")%>';
    const apiGet = '<%=url("admin/app/get_dashboard_param")%>';
    const apiSet = '<%=url("admin/app/set_dashboard_param")%>';

    function showModal(msg, ok) {
        if (ok) {
            showCommonModal(msg, 2000, 'success');
        } else {
            showCommonModal(msg, 2000, 'error');
        }
    }

    function loadDeviceList() {
        $.getJSON(apiGetDeviceList, function(resp){
            if(resp && resp.code === 2000 && resp.data && resp.data.device_list) {
                const deviceList = resp.data.device_list;
                const $select = $('#monitor-device');
                $select.empty();

                if(Array.isArray(deviceList)) {
                    deviceList.forEach(function(device) {
                        const value = typeof device === 'string' ? device : (device.value || device.name || device);
                        $select.append($('<option>').val(value).text(value));
                    });
                }

                refresh();
            } else {
                $('#setting-tip').text(_LoadFailed);
            }
        }).fail(function(){
            $('#setting-tip').text(_LoadFailed);
        });
    }

    function refresh() {
        $('#setting-tip').text(_Loading);
        $.getJSON(apiGet, function(resp){
            const d = (resp && resp.data) || {};
            const monitorDevice = d.monitor_device || '';
            $('#monitor-device').val(monitorDevice);
            $('#setting-tip').text('');
        }).fail(function(){
            $('#setting-tip').text(_LoadFailed);
        });
    }

    function save() {
        const payload = { monitor_device: $('#monitor-device').val() || '' };
        $('#setting-save').prop('disabled', true);
        $.ajax({
            url: apiSet,
            method: 'POST',
            data: payload
        }).done(function(resp){
            if (resp && (resp.code === 0 || resp.code === 2000)) {
                showModal(_SavedSuccessfully, true);
            } else {
                showModal(_SaveFailed, false);
            }
        }).fail(function(){
            showModal(_SaveFailed, false);
        }).always(function(){
            $('#setting-save').prop('disabled', false);
        });
    }

    $('#setting-refresh').on('click', loadDeviceList);
    $('#setting-save').on('click', save);
    $(loadDeviceList);
})();
</script>

<%+footer%>
